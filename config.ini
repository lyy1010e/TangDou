# TangDou 下载配置
[download]
# 原始视频下载目录；脚本启动时会清空这个目录。
output_dir = download

# 是否打印列表接口和播放接口的完整 JSON；排查高清源时可改为 true。
debug_api_response = false

# 去片头片尾开关：true 时根据视频的 head_t/end_t 标记裁掉片头片尾。
trim_enabled = true

# 视频增强配置
[upscale]
# true 表示普通源新下载完成后自动尝试增强；false 表示只下载不增强。
enabled = false

# ffmpeg 速度快；realesrgan 更慢但细节更强。
enhance_engine = ffmpeg

# 增强版目标高度，默认 720。
target_height = 720

# 增强版输出目录。
output_dir = download/enhanced


# FFmpeg 配置；仅 enhance_engine = ffmpeg 时需要
[ffmpeg]
# FFmpeg 命令名或完整路径；如果系统 PATH 能找到 ffmpeg，可填 ffmpeg。这个通常需要确认。
path = C:/Users/Administrator/AppData/Local/Microsoft/WinGet/Packages/Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe/ffmpeg-8.1.1-full_build/bin/ffmpeg.exe


# Real-ESRGAN 配置；仅 enhance_engine = realesrgan 时需要
[realesrgan]
# 使用 Real-ESRGAN 时需要确认：realesrgan-ncnn-vulkan.exe 的完整路径。
path = D:/realesrgan-ncnn-vulkan-20220424-windows/realesrgan-ncnn-vulkan.exe

# 使用 Real-ESRGAN 时需要确认：临时目录会产生大量图片，建议放在空间充足的盘。
temp_dir = E:/tangdou_upscale_temp
